# Builds the Pixel Quest Android APK in the cloud (free GitHub Actions).
# Runs automatically on every upload/push, or manually from the "Actions" tab.
# Result: a downloadable APK on the repository's "Releases" page + build artifacts.
name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Bundle the game for offline use
        run: npm run build:web

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Apply Pixel Quest settings (fullscreen, landscape, icons)
        run: node scripts/customize-android.js

      - name: Copy game into Android project
        run: npx cap sync android

      - name: Use the project's fixed debug signing key
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare downloads
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PixelQuest.apk
          zip -rq PixelQuest-Android-Project.zip . \
            -x "node_modules/*" "android/.gradle/*" "android/build/*" "android/app/build/*" \
               "android/capacitor-cordova-android-plugins/build/*" ".git/*" "PixelQuest.apk" "PixelQuest-Android-Project.zip"
          ls -lh PixelQuest.apk PixelQuest-Android-Project.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelQuest-APK
          path: |
            PixelQuest.apk
            PixelQuest-Android-Project.zip

      - name: Publish APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" PixelQuest.apk PixelQuest-Android-Project.zip \
            --title "Pixel Quest - build ${{ github.run_number }}" \
            --notes "Debug APK for testing. On your Android phone: download PixelQuest.apk and open it to install." \
            --target "${{ github.sha }}"
